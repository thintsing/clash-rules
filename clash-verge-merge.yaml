# ================================================================
# Merge Template - 优化版
# ================================================================
# 4 Loyalsoldier (proxy/direct/reject/applications)
# + 3 自定义 (AI/Steam/Direct覆盖)
# + 8 GEOSITE
# + 1 GEOIP + 1 MATCH
# ================================================================

rule-providers:
  # ======== 用户自定义覆盖 ========
  custom-ai:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/custom-ai.txt"
    path: ./ruleset/custom-ai.yaml
    interval: 86400

  custom-steam:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/custom-steam.txt"
    path: ./ruleset/custom-steam.yaml
    interval: 86400

  custom-direct:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/custom-direct.txt"
    path: ./ruleset/custom-direct.yaml
    interval: 86400

  # ======== Loyalsoldier 核心规则 ========
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400

  applications:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400

rules:
  # ── 第1层：自定义覆盖 ──
  - RULE-SET,custom-ai,🤖 AI服务
  - RULE-SET,custom-steam,🎮 Steam
  - RULE-SET,custom-direct,🎯 全球直连

  # ── 第2层：Loyalsoldier 核心 ──
  - RULE-SET,applications,🎯 全球直连
  - RULE-SET,reject,🛑 全球拦截
  - RULE-SET,proxy,🌍 国外媒体
  - RULE-SET,direct,🎯 全球直连

  # ── 第3层：GEOSITE 补充 ──
  - GEOSITE,apple,🍎 苹果服务
  - GEOSITE,google,🌍 国外媒体
  - GEOSITE,microsoft,Ⓜ️ 微软服务
  - GEOSITE,telegram,📲 电报信息
  - GEOSITE,private,🎯 全球直连
  - GEOSITE,category-ads-all,🛑 全球拦截
  - GEOSITE,geolocation-cn,🎯 全球直连
  - GEOSITE,geolocation-!cn,🌍 国外媒体

  # ── 第4层：中国 IP 兜底 ──
  - GEOIP,CN,🎯 全球直连,no-resolve

  # ── 第5层：最终兜底 ──
  - MATCH,🐟 漏网之鱼
