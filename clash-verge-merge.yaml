# ================================================================
# Merge Template - 重构版 (GEOSITE 优先 + 最小 Provider)
# ================================================================
# 规则来源: https://github.com/thintsing/proxy-rules
#
# 架构设计:
#   1. 用户自定义规则 (RULE-SET, 13 providers) - 小文件, 按需加载
#   2. 内置数据库 (GEOSITE/GEOIP) - 零网络依赖, 自动更新
#   3. 无冗余内联兜底, 无重复 ls-* providers
#
# 规则优先级:
#   进程匹配 → 自定义代理/直连/拦截 → 服务分类(GEOSITE) →
#   IP段 → 中国网站(GEOSITE) → 中国IP(GEOIP) → MATCH
# ================================================================

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  proxy:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400

  direct:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400

  apple:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400

  steam:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/steam.txt"
    path: ./ruleset/steam.yaml
    interval: 86400

  ai:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/ai.txt"
    path: ./ruleset/ai.yaml
    interval: 86400

  icloud:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400

  private:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400

  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400

  microsoft:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/microsoft.txt"
    path: ./ruleset/microsoft.yaml
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400

  applications:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/thintsing/proxy-rules/main/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400

rules:
  # ──────────────────────────────────────────────────────
  # 第1层：应用进程匹配（最高优先级）
  # ──────────────────────────────────────────────────────
  - RULE-SET,applications,DIRECT

  # ──────────────────────────────────────────────────────
  # 第2层：自定义分类（用户特有规则，优先于通用数据库）
  # ──────────────────────────────────────────────────────
  - RULE-SET,ai,🤖 AI服务
  - RULE-SET,steam,🎮 Steam
  - RULE-SET,proxy,🌍 国外媒体
  - RULE-SET,direct,🎯 全球直连
  - RULE-SET,reject,🛑 全球拦截
  - RULE-SET,private,🎯 全球直连

  # ──────────────────────────────────────────────────────
  # 第3层：GEOSITE 内置数据库（零网络依赖，自动更新）
  # ──────────────────────────────────────────────────────
  - GEOSITE,private,🎯 全球直连
  - GEOSITE,category-ads-all,🛑 全球拦截
  - RULE-SET,microsoft,Ⓜ️ 微软服务
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,icloud,🍎 苹果服务
  - GEOSITE,apple,🍎 苹果服务
  - GEOSITE,microsoft,Ⓜ️ 微软服务
  - GEOSITE,telegram,📲 电报信息

  # ──────────────────────────────────────────────────────
  # 第4层：IP 段匹配
  # ──────────────────────────────────────────────────────
  - RULE-SET,lancidr,🎯 全球直连
  - RULE-SET,cncidr,🎯 全球直连
  - RULE-SET,telegramcidr,📲 电报信息

  # ──────────────────────────────────────────────────────
  # 第5层：国内网站/IP 兜底
  # ──────────────────────────────────────────────────────
  - GEOSITE,geolocation-cn,🎯 全球直连
  - GEOIP,CN,🎯 全球直连,no-resolve

  # ──────────────────────────────────────────────────────
  # 第6层：最终兜底
  # ──────────────────────────────────────────────────────
  - MATCH,🐟 漏网之鱼
