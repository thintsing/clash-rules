# Shadowrocket Rules - Loyalsoldier 完整替换版
# 规则来源: https://github.com/Loyalsoldier/clash-rules
# 自定义覆盖: https://github.com/thintsing/proxy-rules
# 通过 RULE-SET 远程加载，每日自动更新
# 导入方式：小火箭 → 配置 → 编辑规则 → 从 URL 添加规则

# ===== 第1层：内联兜底（最高优先级） =====
DOMAIN-SUFFIX,ipify.org,DIRECT
DOMAIN-SUFFIX,api.ipify.org,DIRECT
DOMAIN-SUFFIX,ipinfo.io,DIRECT

# ===== 第2层：用户自定义覆盖（RULE-SET 远程加载） =====
RULE-SET,https://raw.githubusercontent.com/thintsing/proxy-rules/main/custom-direct.txt,DIRECT

# ===== 第2层：Loyalsoldier 官方规则 =====
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/applications.txt,DIRECT
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt,REJECT
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt,Proxy
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt,DIRECT

# ===== 第3层：IP 段规则 =====
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/lancidr.txt,DIRECT

# ===== 第4层：兜底规则 =====
GEOIP,CN,DIRECT
FINAL,Proxy